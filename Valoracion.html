<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valoración - HAPPYREVIEW PRO</title>
    <?!= include('Css'); ?>
  </head>
  <body style="background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem;">

    <div class="card" style="width: 100%; max-width: 480px; text-align: center;" id="valoracion-card">
      
      <!-- PANTALLA DE CARGA -->
      <div id="loading-view">
        <p style="color: var(--text-muted); padding: 2rem; font-size: 0.95rem;">Cargando establecimiento...</p>
      </div>

      <!-- PANTALLA PRINCIPAL DE ESTRELLAS -->
      <div id="main-view" class="hidden">
        <h1 id="empresa-nombre" style="color: var(--primary); font-size: 1.5rem; margin-bottom: 0.5rem;">Establecimiento</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">¿Cómo calificarías tu experiencia hoy con nosotros?</p>
        
        <div id="stars-container" style="display: flex; justify-content: center; gap: 8px; margin-bottom: 1.5rem; cursor: pointer;">
          <span class="star" data-value="1" style="font-size: 2.5rem; color: #cbd5e1; transition: color 0.2s;" onclick="seleccionarEstrellas(1)">★</span>
          <span class="star" data-value="2" style="font-size: 2.5rem; color: #cbd5e1; transition: color 0.2s;" onclick="seleccionarEstrellas(2)">★</span>
          <span class="star" data-value="3" style="font-size: 2.5rem; color: #cbd5e1; transition: color 0.2s;" onclick="seleccionarEstrellas(3)">★</span>
          <span class="star" data-value="4" style="font-size: 2.5rem; color: #cbd5e1; transition: color 0.2s;" onclick="seleccionarEstrellas(4)">★</span>
          <span class="star" data-value="5" style="font-size: 2.5rem; color: #cbd5e1; transition: color 0.2s;" onclick="seleccionarEstrellas(5)">★</span>
        </div>
        
        <!-- FORMULARIO DE FEEDBACK PRIVADO (1-3 ESTRELLAS) -->
        <div id="feedback-section" class="hidden" style="text-align: left; margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
          <div class="form-group">
            <label style="font-size: 0.85rem; font-weight: bold; color: var(--danger);">¿Qué podríamos haber hecho mejor?</label>
            <textarea id="comentario-cliente" rows="3" placeholder="Cuéntanos tu experiencia de forma privada..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 0.9rem;"></textarea>
          </div>
          <div class="form-group">
            <label style="font-size: 0.85rem;">Tu email (opcional):</label>
            <input type="email" id="email-cliente" placeholder="tu@email.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem;">
          </div>
          <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="enviarValoracionPrivada()">Enviar Opinión</button>
        </div>
      </div>

      <!-- PANTALLA DE ÉXITO Y CUPÓN -->
      <div id="success-view" class="hidden">
        <h2 style="color: var(--success); margin-bottom: 0.5rem; font-size: 1.5rem;">¡Muchas gracias! 🎉</h2>
        <p id="success-message" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;"></p>
        
        <div id="coupon-box" class="hidden" style="background: #f0fdf4; border: 2px dashed var(--success); padding: 15px; border-radius: 8px; margin-bottom: 1.5rem;">
          <p style="font-size: 0.8rem; color: #166534; font-weight: bold; margin-bottom: 5px; letter-spacing: 0.5px;">CUPÓN DE REGALO EXCLUSIVO:</p>
          <h3 id="coupon-code" style="font-family: monospace; font-size: 1.4rem; color: var(--success); margin: 0;"></h3>
          <p id="coupon-desc" style="font-size: 0.8rem; color: #166534; margin-top: 5px;"></p>
        </div>

        <a id="btn-google-redirect" href="#" target="_blank" class="btn btn-success hidden" style="width: 100%; text-decoration: none; display: block; text-align: center; padding: 12px; margin-bottom: 1rem; font-weight: bold;">🌟 Dejar reseña en Google Maps</a>
      </div>

      <!-- PANTALLA DE ERROR / NO DISPONIBLE -->
      <div id="error-view" class="hidden">
        <h2 style="color: var(--danger); margin-bottom: 0.5rem; font-size: 1.3rem;">Establecimiento no disponible</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">El enlace QR no es válido, ha caducado o el establecimiento está inactivo.</p>
      </div>

    </div>

    <script>
      var empresaId = '<?= empresaId ?>';
      var empresaData = null;
      var estrellasSeleccionadas = 0;

      window.onload = function() {
        if (!empresaId) {
          mostrarError();
          return;
        }

        google.script.run
          .withSuccessHandler(function(emp) {
            document.getElementById('loading-view').classList.add('hidden');
            if (!emp || !emp.activo) {
              mostrarError();
              return;
            }
            empresaData = emp;
            document.getElementById('empresa-nombre').innerText = emp.nombre;
            document.getElementById('main-view').classList.remove('hidden');
          })
          .withFailureHandler(function() {
            mostrarError();
          })
          .obtenerEmpresaPorId(empresaId);
      };

      function mostrarError() {
        document.getElementById('loading-view').classList.add('hidden');
        document.getElementById('error-view').classList.remove('hidden');
      }

      function seleccionarEstrellas(n) {
        estrellasSeleccionadas = n;
        var stars = document.querySelectorAll('.star');
        for (var i = 0; i < stars.length; i++) {
          stars[i].style.color = (i < n) ? '#eab308' : '#cbd5e1';
        }

        if (n >= 4) {
          document.getElementById('feedback-section').classList.add('hidden');
          enviarValoracion(n, '', '');
        } else {
          document.getElementById('feedback-section').classList.remove('hidden');
        }
      }

      function enviarValoracionPrivada() {
        var comentario = document.getElementById('comentario-cliente').value;
        var email = document.getElementById('email-cliente').value;
        enviarValoracion(estrellasSeleccionadas, comentario, email);
      }

      function enviarValoracion(estrellas, comentario, email) {
        google.script.run
          .withSuccessHandler(function(res) {
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
            
            if (estrellas >= 4) {
              document.getElementById('success-message').innerText = '¡Muchas gracias por tu valoración de ' + estrellas + ' estrellas! Canjea tu regalo en el establecimiento.';
              if (res && res.cupon) {
                document.getElementById('coupon-code').innerText = res.cupon.codigo;
                document.getElementById('coupon-desc').innerText = res.cupon.descuento;
                document.getElementById('coupon-box').classList.remove('hidden');
              }
              if (empresaData && empresaData.googleUrl) {
                var btnG = document.getElementById('btn-google-redirect');
                btnG.href = empresaData.googleUrl;
                btnG.classList.remove('hidden');
              }
            } else {
              document.getElementById('success-message').innerText = 'Hemos recibido tus comentarios de forma privada. Muchas gracias por ayudarnos a mejorar.';
            }
          })
          .withFailureHandler(function() {
            alert('Error al registrar la valoración. Inténtalo de nuevo.');
          })
          .guardarValoracion(empresaId, estrellas, comentario, email);
      }
    <\/script>
  </body>
</html>
