<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>HappyReview Pro</title>

<style>

:root{

  --primary:#4f46e5;
  --success:#22c55e;
  --danger:#ef4444;
  --text:#0f172a;
  --text-muted:#64748b;
  --border:#e2e8f0;
  --bg:#f8fafc;

}

*{

  margin:0;
  padding:0;
  box-sizing:border-box;

}

body{

  font-family:Arial,sans-serif;

  background:var(--bg);

  display:flex;

  justify-content:center;

  align-items:center;

  min-height:100vh;

  padding:20px;

}

.card{

  width:100%;

  max-width:500px;

  background:white;

  border-radius:16px;

  padding:30px;

  box-shadow:
  0 5px 20px rgba(0,0,0,.08);

  text-align:center;

}

.star{

  font-size:48px;

  cursor:pointer;

  color:#cbd5e1;

}

.star.active{

  color:#facc15;

}

.hidden{

  display:none;

}

button{

  width:100%;

  padding:12px;

  border:none;

  border-radius:10px;

  cursor:pointer;

  color:white;

  background:var(--primary);

}

textarea,
input{

  width:100%;

  padding:10px;

  margin:8px 0;

}

.good{

  color:var(--success);

}

.bad{

  color:var(--danger);

}

</style>

</head>

<body>

<div class="card">

<div id="loader">

Cargando empresa...

</div>

<div id="app" class="hidden">

<h1 id="empresa">

Empresa

</h1>

<p>

¿Cómo ha sido tu experiencia?

</p>

<br>

<div id="stars">

<span class="star" onclick="votar(1)">★</span>
<span class="star" onclick="votar(2)">★</span>
<span class="star" onclick="votar(3)">★</span>
<span class="star" onclick="votar(4)">★</span>
<span class="star" onclick="votar(5)">★</span>

</div>

<div
id="feedback"
class="hidden">

<br>

<textarea
id="comentario"
placeholder="¿Qué podemos mejorar?">
</textarea>

<input
id="email"
type="email"
placeholder="Tu email (opcional)">

<button
onclick="enviarPrivado()">

Enviar Opinión

</button>

</div>

<div
id="success"
class="hidden">

</div>

</div>

</div>

<script>

const API_URL =
'TU_URL_APPS_SCRIPT';

const params =
new URLSearchParams(
  location.search
);

const empresaId =
params.get('id');

let empresa = null;

let estrellas = 0;

cargarEmpresa();

async function cargarEmpresa(){

  if(!empresaId){

    document
    .getElementById('loader')
    .innerHTML =
    'Empresa no especificada';

    return;

  }

  try{

    const r = await fetch(

      API_URL +

      '?action=getEmpresa&id=' +

      empresaId

    );

    const data =
      await r.json();

    if(!data.success){

      throw 'No encontrada';

    }

    empresa =
      data.empresa;

    document
    .getElementById(
      'empresa'
    )
    .innerText =
    empresa.nombre;

    document
    .getElementById(
      'loader'
    )
    .classList
    .add('hidden');

    document
    .getElementById(
      'app'
    )
    .classList
    .remove('hidden');

  }

  catch(e){

    document
    .getElementById(
      'loader'
    )
    .innerHTML =
    'Empresa no disponible';

  }

}

function votar(n){

  estrellas = n;

  document
  .querySelectorAll('.star')

  .forEach(function(s,i){

    s.classList.toggle(
      'active',
      i < n
    );

  });

  if(

    n >= 4

  ){

    enviarValoracion(
      ''
    );

  }

  else{

    document
    .getElementById(
      'feedback'
    )
    .classList
    .remove(
      'hidden'
    );

  }

}

function enviarPrivado(){

  enviarValoracion(

    document
    .getElementById(
      'comentario'
    )
    .value

  );

}

async function enviarValoracion(
  comentario
){

  const email =

    document
    .getElementById(
      'email'
    )

    ?

    document
    .getElementById(
      'email'
    ).value

    :

    '';

  const url =

    API_URL +

    '?action=votar' +

    '&id=' +

    empresaId +

    '&estrellas=' +

    estrellas +

    '&comentario=' +

    encodeURIComponent(
      comentario
    ) +

    '&email=' +

    encodeURIComponent(
      email
    );

  const r =
    await fetch(url);

  const data =
    await r.json();

  document
  .getElementById(
    'feedback'
  )
  .classList
  .add('hidden');

  let html =

    '<h2 class="good">Gracias por tu valoración</h2>';

  if(

    estrellas >= 4

  ){

    if(

      data.cupon

    ){

      html +=

      '<p><strong>' +

      data.cupon.codigo +

      '</strong></p>';

    }

    if(

      empresa.googleUrl

    ){

      html +=

      '<br><a href="' +

      empresa.googleUrl +

      '" target="_blank">Dejar reseña en Google</a>';

    }

  }

  document
  .getElementById(
    'success'
  )
  .innerHTML =
  html;

  document
  .getElementById(
    'success'
  )
  .classList
  .remove(
    'hidden'
  );

}

</script>

</body>

</html>
