<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-light: #e0e7ff;
    --success: #059669;
    --success-light: #d1fae5;
    --warning: #d97706;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --shadow-subtle: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
    --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
    --shadow-elevated: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  
  body { 
    background-color: var(--bg-main); 
    color: var(--text-main); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 1rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 { 
    font-size: 1.15rem; 
    font-weight: 800; 
    color: var(--text-main); 
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  header h1::before {
    content: '';
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--primary);
    border-radius: 50%;
  }

  .nav-actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  
  .nav-btn {
    background: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-subtle);
  }
  .nav-btn:hover { 
    background: var(--bg-main); 
    color: var(--primary); 
    border-color: #c7d2fe;
    transform: translateY(-1px);
  }

  .container { max-width: 1240px; margin: 2.5rem auto; padding: 0 1.5rem; width: 100%; flex: 1; }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    padding: 2rem;
    box-shadow: var(--shadow-card);
    margin-bottom: 1.75rem;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .card:hover {
    box-shadow: var(--shadow-subtle);
    border-color: #cbd5e1;
  }

  .card h2 { 
    font-size: 1.25rem; 
    font-weight: 700; 
    color: var(--text-main); 
    margin-bottom: 1.5rem; 
    letter-spacing: -0.3px;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.25rem;
    margin-bottom: 1.75rem;
  }

  .metric-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .metric-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-elevated);
  }
  .metric-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 3px;
    background: var(--primary);
  }
  .metric-card.pos::after { background: var(--success); }
  .metric-card.warn::after { background: var(--warning); }
  .metric-card.danger::after { background: var(--danger); }

  .metric-card p, .metric-title { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
  .metric-card h3, .metric-value { font-size: 2rem; font-weight: 800; color: var(--text-main); letter-spacing: -1px; }
  .metric-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 1.5rem;
  }

  .form-group { margin-bottom: 1.25rem; }
  .form-row { display: flex; gap: 1rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.3px; }
  
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    color: var(--text-main);
    background: #fff;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-subtle);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-light);
  }

  .checkbox-container {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    font-size: 0.95rem;
  }
  .checkbox-container input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

  .form-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }

  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0.75rem 1.25rem;
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    box-shadow: 0 1px 2px 0 rgba(79, 70, 229, 0.2);
  }
  .btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
  .btn:active { transform: translateY(0); }
  
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; border-radius: 6px; }
  .btn-secondary { background: #f1f5f9; color: var(--text-muted); border: 1px solid var(--border-color); box-shadow: none; }
  .btn-secondary:hover { background: #e2e8f0; color: var(--text-main); }
  .btn-outline { background: transparent; color: var(--primary); border: 1px solid #c7d2fe; box-shadow: none; }
  .btn-outline:hover { background: var(--primary-light); color: var(--primary-hover); }
  .btn-success { background: var(--success); }
  .btn-success:hover { background: #047857; }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #b91c1c; }

  .table-container { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
  th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
  th { background: #fafafa; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.8px; }
  tr { transition: background 0.15s ease; }
  tr:hover { background: #fcfcfd; }

  .badge {
    display: inline-block;
    padding: 0.3rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-active { background: var(--success-light); color: var(--success); }
  .badge-inactive { background: var(--danger-light); color: var(--danger); }
  .badge-standard { background: #f1f5f9; color: var(--text-muted); }
  .badge-premium { background: #ede9fe; color: #7c3aed; }

  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 1rem;
    animation: fadeIn 0.2s ease;
  }
  .modal-content {
    background: #fff;
    border-radius: calc(var(--radius) + 4px);
    padding: 2.5rem;
    max-width: 580px;
    width: 100%;
    box-shadow: var(--shadow-elevated);
    text-align: center;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid var(--border-color);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .hidden { display: none !important; }
  .text-center { text-align: center; }
</style>
