<div class="card" id="form-card-empresa">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
    <h2 id="empresa-form-title" style="margin-bottom: 0;">✨ Registrar Nueva Empresa</h2>
    <span class="badge badge-premium" id="modo-edicion-badge" style="display: none;">Modo Edición Activo</span>
  </div>
  
  <form id="empresa-form" onsubmit="guardarEmpresa(event)">
    <input type="hidden" id="emp-id">
    
    <div class="form-row">
      <div class="form-group" style="flex: 2;">
        <label>Nombre de la Empresa</label>
        <input type="text" id="emp-nombre" required placeholder="Ej. Restaurante La Tasca">
      </div>
      <div class="form-group" style="flex: 1;">
        <label>Plan SaaS</label>
        <select id="emp-plan">
          <option value="Standard">Standard</option>
          <option value="Premium">Premium</option>
        </select>
      </div>
    </div>
    
    <div class="form-row">
      <div class="form-group" style="flex: 1;">
        <label>Email de Contacto</label>
        <input type="email" id="emp-email" required placeholder="local@empresa.com">
      </div>
      <div class="form-group" style="flex: 1;">
        <label>Teléfono</label>
        <input type="text" id="emp-telefono" placeholder="+34 600 000 000">
      </div>
    </div>
    
    <div class="form-group">
      <label>URL Directa de Reseñas de Google Maps</label>
      <input type="url" id="emp-google" required placeholder="https://g.page/r/...">
    </div>
    
    <div class="form-group">
      <label>Recompensa por 4-5 Estrellas (Cupón de Fidelización)</label>
      <input type="text" id="emp-recompensa" required value="10% de descuento en tu próxima visita" placeholder="Ej. Postre gratis / 15% descuento">
    </div>
    
    <div class="form-group hidden" id="emp-activo-div">
      <label class="checkbox-container">
        <input type="checkbox" id="emp-activo" checked> Empresa Activa en la plataforma
      </label>
    </div>
    
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" id="btn-guardar-empresa">Crear Empresa</button>
      <button type="button" class="btn btn-secondary hidden" id="btn-cancelar-empresa" onclick="resetFormEmpresa()">Cancelar Edición</button>
    </div>
  </form>
</div>

<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;">
    <h2>🏢 Listado de Establecimientos y Accesos</h2>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <input type="text" id="buscar-empresa-input" placeholder="🔍 Buscar empresa..." onkeyup="filtrarTablaEmpresasLocal()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 8px; border: 1px solid var(--border-color); width: 220px;">
      <span class="badge badge-active" id="total-empresas-badge">0 registradas</span>
      <button class="btn btn-sm btn-outline" onclick="cargarEmpresasAdmin()">🔄 Actualizar</button>
    </div>
  </div>
  
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Establecimiento & Recompensa</th>
          <th>Contacto</th>
          <th>Plan / Estado</th>
          <th style="text-align: right;">Acciones de Gestión & QR</th>
        </tr>
      </thead>
      <tbody id="empresas-tbody"></tbody>
    </table>
  </div>
</div>

<script>
  window.listaEmpresasGlobal = window.listaEmpresasGlobal || [];
  var ghEmpresasGasUrl = window.gasUrl || "https://script.google.com/macros/s/AKfycbyh5EuURGrICHOQaaayQM6enInHwfBuz4Lc0qgWcFTeajKPv-asfuUb_xYgp22PHPro2g/exec";
  var ghEmpresasDomain = window.githubAppDomain || 'https://fryserviciosdigitales.github.io/FRYhappyreview-pro';

  function ghEmpresasApiGet(paramsObj) {
    if (typeof window.llamarApi === 'function') {
      return window.llamarApi(paramsObj);
    }
    var qs = Object.keys(paramsObj).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(paramsObj[k] !== undefined && paramsObj[k] !== null ? paramsObj[k] : '');
    }).join('&');
    return fetch(ghEmpresasGasUrl + '?' + qs).then(function(res) { return res.json(); });
  }

  function escaparAttrJs(str) {
    return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  function cargarEmpresasAdmin() {
    var tbody = document.getElementById('empresas-tbody');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="padding: 1.5rem; color: var(--text-muted);">Cargando establecimientos...</td></tr>';
    }

    ghEmpresasApiGet({ action: 'getEmpresas' })
      .then(function(data) {
        var lista = (data && data.empresas) ? data.empresas : (Array.isArray(data) ? data : []);
        window.listaEmpresasGlobal = lista;
        renderizarTablaEmpresas(window.listaEmpresasGlobal);
      })
      .catch(function(err) {
        console.error(err);
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="padding: 1.5rem; color: var(--danger);">Error al cargar establecimientos.</td></tr>';
        }
      });
  }

  function renderizarTablaEmpresas(lista) {
    var tbody = document.getElementById('empresas-tbody');
    var badgeTotal = document.getElementById('total-empresas-badge');
    if (!tbody) return;
    
    tbody.innerHTML = '';
    if (badgeTotal) badgeTotal.innerText = lista.length + ' registradas';

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="padding: 2rem; color: var(--text-muted);">No hay empresas registradas todavía.</td></tr>';
      return;
    }

    for (var i = 0; i < lista.length; i++) {
      var emp = lista[i];
      var empIdEsc = escaparAttrJs(emp.id);
      var panelUrl = ghEmpresasDomain + '/?panel=' + encodeURIComponent(emp.id);
      var panelUrlEsc = escaparAttrJs(panelUrl);
      
      tbody.innerHTML += '<tr>' +
        '<td><strong>' + (emp.nombre || '') + '</strong><br><small style="color: var(--primary); font-weight: 500;">🎁 ' + (emp.recompensa || 'Cupón estándar') + '</small></td>' +
        '<td>' + (emp.email || '') + '<br><small style="color: var(--text-muted);">' + (emp.telefono || 'Sin teléfono') + '</small></td>' +
        '<td><span class="badge ' + (emp.plan === 'Premium' ? 'badge-premium' : 'badge-standard') + '">' + (emp.plan || 'Standard') + '</span><br><span class="badge ' + (emp.activo ? 'badge-active' : 'badge-inactive') + '" style="margin-top: 4px;">' + (emp.activo ? 'Activa' : 'Inactiva') + '</span></td>' +
        '<td style="text-align: right; white-space: nowrap;">' +
          '<button class="btn btn-sm btn-success" onclick="abrirModalCartelPorEmpresa(\'' + empIdEsc + '\')">🖨️ QR</button> ' +
          '<button class="btn btn-sm btn-outline" onclick="prepararEdicionEmpresa(\'' + empIdEsc + '\')">✏️ Editar</button> ' +
          '<button class="btn btn-sm btn-secondary" onclick="copiarEnlacePanel(\'' + panelUrlEsc + '\')">🔗 Panel</button> ' +
          '<button class="btn btn-sm btn-danger" onclick="eliminarEmpresa(\'' + empIdEsc + '\')">🗑️</button>' +
        '</td>' +
        '</tr>';
    }
  }

  function filtrarTablaEmpresasLocal() {
    var q = document.getElementById('buscar-empresa-input').value.toLowerCase().trim();
    if (!q) {
      renderizarTablaEmpresas(window.listaEmpresasGlobal);
      return;
    }
    var filtradas = window.listaEmpresasGlobal.filter(function(emp) {
      return (emp.nombre && emp.nombre.toLowerCase().includes(q)) ||
             (emp.email && emp.email.toLowerCase().includes(q)) ||
             (emp.telefono && emp.telefono.toLowerCase().includes(q)) ||
             (emp.plan && emp.plan.toLowerCase().includes(q));
    });
    renderizarTablaEmpresas(filtradas);
  }

  function guardarEmpresa(e) {
    e.preventDefault();
    var id = document.getElementById('emp-id').value;
    var nombre = document.getElementById('emp-nombre').value;
    var email = document.getElementById('emp-email').value;
    var telefono = document.getElementById('emp-telefono').value;
    var googleUrl = document.getElementById('emp-google').value;
    var plan = document.getElementById('emp-plan').value;
    var recompensa = document.getElementById('emp-recompensa').value;
    var activo = document.getElementById('emp-activo').checked;

    var btn = document.getElementById('btn-guardar-empresa');
    var textoOriginalBtn = id ? 'Actualizar Cambios' : 'Crear Empresa';
    btn.disabled = true;
    btn.innerText = 'Guardando...';

    var params = id
      ? {
          action: 'editarEmpresa',
          id: id,
          nombre: nombre,
          email: email,
          telefono: telefono,
          googleUrl: googleUrl,
          plan: plan,
          activo: activo,
          recompensa: recompensa
        }
      : {
          action: 'crearEmpresa',
          nombre: nombre,
          email: email,
          telefono: telefono,
          googleUrl: googleUrl,
          plan: plan,
          recompensa: recompensa
        };

    ghEmpresasApiGet(params)
      .then(function(res) {
        btn.disabled = false;
        btn.innerText = textoOriginalBtn;
        if (res && res.success) {
          resetFormEmpresa();
          cargarEmpresasAdmin();
          mostrarNotificacionToast(id ? 'Empresa actualizada correctamente.' : 'Empresa creada correctamente.');
        } else {
          alert('Error al guardar: ' + ((res && (res.error || res.message)) || 'Error desconocido'));
        }
      })
      .catch(function(err) {
        console.error(err);
        btn.disabled = false;
        btn.innerText = textoOriginalBtn;
        alert('Error de conexión al guardar la empresa.');
      });
  }

  function prepararEdicionEmpresa(id) {
    var emp = null;
    var lista = window.listaEmpresasGlobal || [];
    
    for (var i = 0; i < lista.length; i++) {
      if (String(lista[i].id) === String(id)) { 
        emp = lista[i]; 
        break; 
      }
    }

    if (!emp) {
      alert('No se encontró la empresa con ID: ' + id);
      return;
    }

    document.getElementById('empresa-form-title').innerText = '✏️ Editando: ' + emp.nombre;
    document.getElementById('modo-edicion-badge').style.display = 'inline-block';
    document.getElementById('emp-id').value = emp.id;
    document.getElementById('emp-nombre').value = emp.nombre;
    document.getElementById('emp-email').value = emp.email;
    document.getElementById('emp-telefono').value = emp.telefono || '';
    document.getElementById('emp-google').value = emp.googleUrl;
    document.getElementById('emp-plan').value = emp.plan;
    document.getElementById('emp-recompensa').value = emp.recompensa || '';
    document.getElementById('emp-activo').checked = !!emp.activo;
    
    document.getElementById('emp-activo-div').classList.remove('hidden');
    document.getElementById('btn-cancelar-empresa').classList.remove('hidden');
    document.getElementById('btn-guardar-empresa').innerText = 'Actualizar Cambios';
    document.getElementById('form-card-empresa').style.borderColor = 'var(--primary)';
    
    document.getElementById('form-card-empresa').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetFormEmpresa() {
    document.getElementById('empresa-form-title').innerText = '✨ Registrar Nueva Empresa';
    document.getElementById('modo-edicion-badge').style.display = 'none';
    document.getElementById('empresa-form').reset();
    document.getElementById('emp-id').value = '';
    document.getElementById('emp-activo-div').classList.add('hidden');
    document.getElementById('btn-cancelar-empresa').classList.add('hidden');
    document.getElementById('btn-guardar-empresa').innerText = 'Crear Empresa';
    document.getElementById('form-card-empresa').style.borderColor = 'var(--border-color)';
  }

  function eliminarEmpresa(id) {
    if (confirm('¿Estás totalmente seguro de eliminar esta empresa y sus datos asociados?')) {
      ghEmpresasApiGet({ action: 'eliminarEmpresa', id: id })
        .then(function(res) {
          if (!res || res.success === false) {
            alert('No se pudo eliminar la empresa: ' + ((res && (res.error || res.message)) || 'Error'));
            return;
          }
          cargarEmpresasAdmin();
          mostrarNotificacionToast('Empresa eliminada correctamente.');
        })
        .catch(function(err) {
          console.error(err);
          alert('Error de conexión al eliminar la empresa.');
        });
    }
  }

  function copiarEnlacePanel(url) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() {
        mostrarNotificacionToast('¡Enlace de acceso directo copiado al portapapeles!');
      }, function() {
        prompt('Copia este enlace de acceso directo:', url);
      });
    } else {
      prompt('Copia este enlace de acceso directo:', url);
    }
  }

  function mostrarNotificacionToast(mensaje) {
    var toast = document.createElement('div');
    toast.innerText = mensaje;
    toast.style.cssText = 'position:fixed; bottom:20px; right:20px; background:#0f172a; color:#fff; padding:12px 24px; border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.2); z-index:9999; font-size:0.9rem; font-weight:500;';
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 2500);
  }
</script>
